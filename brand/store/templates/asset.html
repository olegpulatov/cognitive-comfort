<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cognitive Comfort store asset</title>
<style>
  /*
    Store artwork drawn in the shipped panel world: ink-umber ground, dim parchment,
    hairline rules, one brass accent, Literata catalog lettering. Every asset is
    rendered from this one template at its exact store pixel size, so a copy change
    in copy.json costs a re-render instead of new art.
  */
  @font-face {
    font-family: 'Literata';
    src: url('../../../public/fonts/literata-latin-var.woff2') format('woff2-variations');
    font-weight: 400 600;
    font-display: block;
  }

  :root {
    --ground: #14110e;
    --sheet: #201c17;
    --rule: #332c23;
    --rule-strong: #4a4032;
    --ink: #eee6d8;
    --ink-quiet: #b0a390;
    --ink-faint: #96897a;
    --brass: #cba463;
    --serif: 'Literata', 'Iowan Old Style', Palatino, Georgia, serif;
    --mono: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { background: var(--ground); }

  body {
    font-family: var(--serif);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }

  .asset {
    position: relative;
    overflow: hidden;
    background: var(--ground);
    display: grid;
  }

  /* Paper grain, from the subject's world: the back of a dark catalog card. */
  .asset::before {
    content: '';
    position: absolute;
    inset: 0;
    background: url('../textures/paper-ink.jpg') center / cover no-repeat;
    opacity: 0.55;
    mix-blend-mode: screen;
  }

  .asset > * { position: relative; }

  .mark { display: flex; align-items: center; gap: 14px; }
  .mark img { display: block; }
  .mark span {
    font-weight: 600;
    letter-spacing: 0.01em;
    font-variation-settings: 'opsz' 18;
  }

  h1 {
    font-weight: 600;
    line-height: 1.1;
    letter-spacing: -0.015em;
    font-variation-settings: 'opsz' 32;
    white-space: pre-line;
    text-wrap: balance;
  }

  .caption {
    color: var(--ink-quiet);
    line-height: 1.45;
    max-width: 62ch;
    font-variation-settings: 'opsz' 16;
  }

  .legend {
    font-family: var(--mono);
    text-transform: uppercase;
    letter-spacing: 0.11em;
    color: var(--ink-faint);
  }

  /* A capture is presented as a filed record: hairline rule, near-crisp corner,
     brass filing tab on the edge. No fake browser chrome, no perspective mockup. */
  .record { position: relative; align-self: center; justify-self: center; }
  .record img {
    display: block;
    width: 100%;
    height: auto;
    border: 1px solid var(--rule-strong);
    border-radius: 3px;
    box-shadow: 0 30px 70px -28px rgba(0, 0, 0, 0.9);
  }
  .record::after {
    content: '';
    position: absolute;
    left: 26px;
    top: -5px;
    width: 46px;
    height: 5px;
    background: var(--brass);
    border-radius: 1px;
  }
  .record.is-clipped img { border-radius: 3px 3px 0 0; }

  /* Every layout fixes the record's box and lets the capture crop inside it, so a
     tall popup or options capture can never push the words off the canvas. */
  .record img { height: 100%; object-fit: cover; object-position: top center; }

  /* ---- marquee 1400x560 ---- */
  .kind-marquee {
    grid-template-columns: 1fr 430px;
    align-items: center;
    gap: 56px;
    padding: 0 0 0 88px;
  }
  .kind-marquee .mark { margin-bottom: 34px; }
  .kind-marquee .mark img { width: 60px; height: 60px; }
  .kind-marquee .mark span { font-size: 25px; }
  .kind-marquee h1 { font-size: 56px; }
  .kind-marquee .caption { font-size: 21px; margin-top: 24px; max-width: 34ch; }
  .kind-marquee .record { width: 430px; height: 430px; margin-right: -18px; }

  /* ---- small tile 440x280 ---- */
  .kind-tile {
    place-content: center;
    justify-items: center;
    text-align: center;
    padding: 30px;
    gap: 0;
  }
  .kind-tile .mark { flex-direction: column; gap: 16px; }
  .kind-tile .mark img { width: 88px; height: 88px; }
  .kind-tile .mark span { font-size: 27px; }
  .kind-tile h1 { font-size: 20px; margin-top: 18px; color: var(--ink-quiet); font-weight: 400; }

  /* ---- screenshots 1280x800 ---- */
  .kind-shot, .kind-shot-portrait {
    grid-template-columns: 400px 1fr;
    align-items: center;
    column-gap: 56px;
    padding-left: 64px;
  }
  .kind-shot h1, .kind-shot-portrait h1 { font-size: 38px; }
  .kind-shot .mark, .kind-shot-portrait .mark { margin-bottom: 26px; }
  .kind-shot .mark img, .kind-shot-portrait .mark img { width: 34px; height: 34px; }
  .kind-shot .mark span, .kind-shot-portrait .mark span { font-size: 17px; }
  .kind-shot .caption, .kind-shot-portrait .caption { font-size: 17px; margin-top: 16px; }
  .kind-shot .legend, .kind-shot-portrait .legend { font-size: 12px; margin-bottom: 20px; }

  .kind-shot .record { width: 100%; height: 620px; margin-right: -80px; }
  .kind-shot .record img { object-position: top left; }

  .kind-shot-portrait .stage {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 40px;
    margin-right: -80px;
  }
  .kind-shot-portrait .record { width: 330px; height: 660px; flex: none; }
</style>
</head>
<body>
<script type="module">
  const params = new URLSearchParams(location.search);
  const id = params.get('id');
  const copy = await fetch('../copy.json').then((r) => r.json());
  const asset = copy.assets.find((entry) => entry.id === id);
  if (!asset) throw new Error(`unknown asset id: ${id}`);

  const el = (tag, className, text) => {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text) node.textContent = text;
    return node;
  };

  const record = (src, clipped) => {
    const wrap = el('div', clipped ? 'record is-clipped' : 'record');
    const img = document.createElement('img');
    img.src = src;
    img.alt = '';
    wrap.append(img);
    return wrap;
  };

  const mark = () => {
    const wrap = el('div', 'mark');
    const img = document.createElement('img');
    img.src = '../../icon/icon-1024.png';
    img.alt = '';
    wrap.append(img, el('span', null, copy.wordmark));
    return wrap;
  };

  const root = el('div', `asset kind-${asset.kind}`);
  root.style.width = `${asset.width}px`;
  root.style.height = `${asset.height}px`;

  if (asset.kind === 'marquee') {
    const text = el('div');
    text.append(mark(), el('h1', null, asset.headline), el('p', 'caption', asset.caption));
    root.append(text, record(`../${asset.capture}`, true));
  } else if (asset.kind === 'tile') {
    root.append(mark(), el('h1', null, asset.headline));
  } else {
    const head = el('div', 'head');
    head.append(mark(), el('h1', null, asset.headline), el('p', 'caption', asset.caption));
    root.append(head);
    if (asset.kind === 'shot-portrait') {
      const stage = el('div', 'stage');
      stage.append(record(`../${asset.capture}`, true));
      if (asset.captureSecondary) stage.append(record(`../${asset.captureSecondary}`, true));
      root.append(stage);
    } else {
      root.append(record(`../${asset.capture}`, true));
    }
  }

  document.body.style.width = `${asset.width}px`;
  document.body.style.height = `${asset.height}px`;
  document.body.append(root);
  await document.fonts.ready;
  await Promise.all([...document.images].map((img) => img.decode().catch(() => {})));
  document.documentElement.dataset.ready = 'true';
</script>
</body>
</html>
