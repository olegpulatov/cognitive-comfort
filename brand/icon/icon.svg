<!--
  Cognitive Comfort — icon master. Authored vector; no image-model raster source.

  Mark: four media cells on an ink-umber plate. Three stay quieted (dimmed brass,
  nothing legible inside); the fourth is revealed — parchment, with its form crisp.
  Nothing is removed; one thing is shown. Palette is the shipped panel world
  (ground #14110e, dimmed brass #54462f, parchment #eee6d8, rule #332c23).

  Grid: 128 units on an 8-unit rhythm, so 16px renders on whole pixels.
  Edit this file, then run `scripts/generate-icons.sh` to regenerate every raster size.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Cognitive Comfort">
  <rect x="4" y="4" width="120" height="120" rx="24" fill="#14110e"/>
  <rect x="4.75" y="4.75" width="118.5" height="118.5" rx="23.25" fill="none" stroke="#332c23" stroke-width="1.5"/>

  <g fill="#54462f">
    <rect x="24" y="24" width="36" height="36" rx="3"/>
    <rect x="68" y="24" width="36" height="36" rx="3"/>
    <rect x="24" y="68" width="36" height="36" rx="3"/>
  </g>

  <rect x="68" y="68" width="36" height="36" rx="3" fill="#eee6d8"/>
  <circle cx="86" cy="86" r="10" fill="#14110e"/>
</svg>
