<!--
  Cognitive Comfort — macOS/iOS app-icon master for the Safari containing app.
  Same mark, drawn on Apple's 1024 canvas: the plate is inset to Apple's grid
  (824px live area) and carries Apple's continuous-corner radius ratio, because
  macOS does not mask app icons. Generated sizes come from scripts/generate-icons.sh.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Cognitive Comfort">
  <rect x="100" y="100" width="824" height="824" rx="184" fill="#14110e"/>
  <rect x="106" y="106" width="812" height="812" rx="178" fill="none" stroke="#332c23" stroke-width="12"/>

  <g fill="#54462f">
    <rect x="260" y="260" width="228" height="228" rx="19"/>
    <rect x="536" y="260" width="228" height="228" rx="19"/>
    <rect x="260" y="536" width="228" height="228" rx="19"/>
  </g>

  <rect x="536" y="536" width="228" height="228" rx="19" fill="#eee6d8"/>
  <circle cx="650" cy="650" r="63" fill="#14110e"/>
</svg>
