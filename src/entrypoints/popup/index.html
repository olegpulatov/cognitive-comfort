<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cognitive Comfort</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body class="popup-shell">
    <div class="popup-container">
      <header class="masthead">
        <h1 class="wordmark">
          Cognitive Comfort
          <span class="wordmark-note">Reading room</span>
        </h1>
        <button id="pauseBtn" class="press" type="button">Pause</button>
      </header>

      <p id="ledger" class="ledger" aria-live="polite">
        <span class="ledger-mark" aria-hidden="true"></span>
        <span class="ledger-text">
          <span id="ledgerState">Checking this page</span>
          <span id="ledgerBecause" class="ledger-because"></span>
        </span>
      </p>

      <div id="saveNotice" class="notice" role="status" hidden></div>

      <section id="siteSheet" class="sheet" aria-labelledby="siteSheetLegend">
        <h2 class="sheet-legend" id="siteSheetLegend">
          This site
          <span id="currentDomain" class="sheet-subject">-</span>
        </h2>

        <fieldset class="field">
          <legend class="field-legend">Media</legend>
          <div id="siteMediaSegments" class="segments">
            <label class="segment">
              <input type="radio" name="siteMedia" value="enabled" id="siteEnabled" />
              <span>Blur</span>
            </label>
            <label class="segment">
              <input type="radio" name="siteMedia" value="disabled" id="siteDisabled" />
              <span>Show</span>
            </label>
            <label class="segment">
              <input type="radio" name="siteMedia" value="default" id="siteDefault" />
              <span>Use global</span>
            </label>
          </div>
          <span id="siteMediaNote" class="field-note"></span>
        </fieldset>

        <fieldset class="field">
          <legend class="field-legend">Emoji</legend>
          <div id="siteEmojiSegments" class="segments">
            <label class="segment">
              <input type="radio" name="siteEmoji" value="enabled" id="emojiSiteEnabled" />
              <span>Hide</span>
            </label>
            <label class="segment">
              <input type="radio" name="siteEmoji" value="disabled" id="emojiSiteDisabled" />
              <span>Show</span>
            </label>
            <label class="segment">
              <input type="radio" name="siteEmoji" value="default" id="emojiSiteDefault" />
              <span>Use global</span>
            </label>
          </div>
          <span id="siteEmojiNote" class="field-note"></span>
        </fieldset>
      </section>

      <section id="globalSheet" class="sheet" aria-labelledby="globalSheetLegend">
        <h2 class="sheet-legend" id="globalSheetLegend">Everywhere else</h2>

        <fieldset class="field">
          <legend class="field-legend">Media</legend>
          <div class="segments">
            <label class="segment">
              <input type="radio" name="globalMedia" value="enabled" id="globalEnabled" />
              <span>Blur</span>
            </label>
            <label class="segment">
              <input type="radio" name="globalMedia" value="disabled" id="globalDisabled" />
              <span>Show</span>
            </label>
          </div>
        </fieldset>

        <fieldset class="field">
          <legend class="field-legend">Emoji</legend>
          <div class="segments">
            <label class="segment">
              <input type="radio" name="globalEmoji" value="enabled" id="emojiGlobalEnabled" />
              <span>Hide</span>
            </label>
            <label class="segment">
              <input type="radio" name="globalEmoji" value="disabled" id="emojiGlobalDisabled" />
              <span>Show</span>
            </label>
          </div>
          <span class="field-note">Applies to every site that has no rule of its own.</span>
        </fieldset>
      </section>

      <section id="revealSheet" class="sheet" aria-labelledby="revealSheetLegend">
        <h2 class="sheet-legend" id="revealSheetLegend">Blur</h2>

        <div class="field">
          <div class="fader-head">
            <label class="field-legend" for="blurAmount">Blur strength</label>
            <span class="fader-value"><span id="blurAmountValue">50</span>px</span>
          </div>
          <input
            type="range"
            id="blurAmount"
            min="1"
            max="100"
            value="50"
            aria-describedby="blurAmountNote"
          />
          <div class="fader-scale" aria-hidden="true">
            <span>1</span>
            <span>50</span>
            <span>100</span>
          </div>
          <span id="blurAmountNote" class="field-note">
            Media is darkened as well as blurred, so it keeps its shape. Reveal gesture and
            coverage live in settings.
          </span>
        </div>
      </section>

      <section class="sheet" aria-labelledby="shortcutsLegend">
        <h2 class="sheet-legend" id="shortcutsLegend">
          Shortcuts
          <button id="editShortcuts" class="press-link" type="button">Change</button>
        </h2>
        <div id="shortcutsList" class="shortcuts-list"></div>
        <div id="shortcutHelp" class="shortcut-help" hidden></div>
      </section>

      <p class="sheet-more">
        <button id="openOptions" class="press-link" type="button">
          All settings and filed site rules
        </button>
      </p>

      <div id="buildInfo" class="imprint"></div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
