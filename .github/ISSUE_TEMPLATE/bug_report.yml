name: Bug report
description: Report a reproducible non-security defect
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not report security vulnerabilities here. Use GitHub private vulnerability reporting.
  - type: input
    id: version
    attributes:
      label: Extension version
      placeholder: 0.3.0
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and OS version
      placeholder: Chrome 140 on macOS 15
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use a public/minimal page when possible; remove private page data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: Console output
      description: Redact credentials, personal domains, and page content.
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: This report contains no security vulnerability or sensitive page data.
          required: true
