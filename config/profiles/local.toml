[meta]
name = "local"

[product]
name = "Cognitive Comfort"
description = "Blurs images, videos, and emoji until you choose to see them."
firefoxExtensionId = "cognitive-comfort@olegpulatov.github.io"

[defaults]
enabled = true
blurScope = "all"
revealMode = "both"
blurAmount = 50
paused = false
blockEmojis = true

[distribution]
safariAppName = "Cognitive Comfort"
safariBundleId = "io.github.olegpulatov.cognitive-comfort.local"
