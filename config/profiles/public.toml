[meta]
name = "public"

[product]
name = "Cognitive Comfort"
description = "Blurs images, videos, and emoji until you choose to see them."
firefoxExtensionId = "cognitive-comfort@olegpulatov.github.io"

[defaults]
enabled = true
blurScope = "content"
revealMode = "click"
blurAmount = 40
paused = false
blockEmojis = false

[distribution]
safariAppName = "Cognitive Comfort"
safariBundleId = "io.github.olegpulatov.cognitive-comfort"
